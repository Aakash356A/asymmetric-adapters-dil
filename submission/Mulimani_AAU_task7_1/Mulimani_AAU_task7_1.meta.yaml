# System information
system:
  # System description, metadata provided here will be used to do a meta-analysis
  # of the submitted system. Use general level tags where possible.
  # If a field is not applicable, use "!!null".
  description:
    # Input sampling rate (Hz)
    input_sampling_rate: 32000

    # Acoustic features / input representation
    acoustic_features: log-mel energies (64 mel bands)

    # Machine learning method / backbone
    machine_learning_method: CNN14 with per-domain residual adapters and per-domain head

    # Data augmentation methods (comma-separated list, or !!null)
    data_augmentation: !!null

    # How the system handles catastrophic forgetting (comma-separated list)
    # e.g. regularization, distillation, domain_specific_components, ...
    catastrophic_forgetting_handling: domain_specific_components

    # Does the system explicitly predict the domain? (true/false)
    # ADIL: domain selected at inference by minimum prediction entropy.
    domain_specific_components: true

  # URL to the source code of the system [optional, highly recommended]
  source_code: https://github.com/Aakash356A/dcase_task7


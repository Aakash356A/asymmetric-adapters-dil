    input_sampling_rate: 32000

    acoustic_features: log-mel energies (64 mel bands)

    machine_learning_method: frozen CNN14 (PANNs) backbone with per-domain BatchNorm, per-domain residual bottleneck adapters of asymmetric depth (D2=1, D3=3), and per-domain linear classifier head

    data_augmentation: !!null


    catastrophic_forgetting_handling: domain_specific_components

    routing_method: Mahanalobis distance based router

 
    domain_specific_components: true

